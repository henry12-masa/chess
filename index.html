<!DOCTYPE html>

<head>

  <meta charset="UTF-8" />
  <title>チェスゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f3f3;
      margin: 0;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    .layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin-top: 10px;
    }

    .ad {
      width: 160px;
      min-height: 600px;
      background: #fff;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
      padding: 10px;
      box-sizing: border-box;
    }

    #board {
      width: 480px;
      height: 480px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #333;
    }

    .square {
      width: 60px;
      height: 60px;
      font-size: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .white {
      background: #f0d9b5;
    }

    .black {
      background: #b58863;
    }

    .selected {
      outline: 4px solid red;
      outline-offset: -4px;
    }

    .check {
      background: #ff7777 !important;
    }

    button {
      margin: 15px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
        align-items: center;
      }

      .ad {
        width: 480px;
        min-height: 90px;
      }
    }
  </style>
</head>
<body>

<h1>チェスゲーム</h1>
<div id="status">白の番です</div>

<div class="layout">

  <div class="ad">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
     crossorigin="anonymous"></script>

     data-full-width-responsive="true"></ins>

  <div id="board"></div>

  <div class="ad">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
     crossorigin="anonymous"></script>
<!-- チェス -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-8398161859137802"
     data-ad-slot="5599163841"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
  </div>

</div>

<button onclick="resetGame()">リセット</button>

<script>
const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");

const pieces = {
  r: "♜", n: "♞", b: "♝", q: "♛", k: "♚", p: "♟",
  R: "♖", N: "♘", B: "♗", Q: "♕", K: "♔", P: "♙"
};

let board;
let selected = null;
let turn = "white";
let gameOver = false;

function initBoard() {
  board = [
    ["r","n","b","q","k","b","n","r"],
    ["p","p","p","p","p","p","p","p"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["P","P","P","P","P","P","P","P"],
    ["R","N","B","Q","K","B","N","R"]
  ];

  selected = null;
  turn = "white";
  gameOver = false;
  updateStatus();
  renderBoard();
}

function renderBoard() {
  boardElement.innerHTML = "";

  const whiteKing = findKing("white");
  const blackKing = findKing("black");

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const square = document.createElement("div");
      square.classList.add("square");
      square.classList.add((row + col) % 2 === 0 ? "white" : "black");

      if (selected && selected.row === row && selected.col === col) {
        square.classList.add("selected");
      }

      if (
        whiteKing &&
        whiteKing.row === row &&
        whiteKing.col === col &&
        isKingInCheck("white")
      ) {
        square.classList.add("check");
      }

      if (
        blackKing &&
        blackKing.row === row &&
        blackKing.col === col &&
        isKingInCheck("black")
      ) {
        square.classList.add("check");
      }

      square.textContent = pieces[board[row][col]] || "";
      square.addEventListener("click", () => handleClick(row, col));
      boardElement.appendChild(square);
    }
  }
}

function handleClick(row, col) {
  if (gameOver || turn !== "white") return;

  const piece = board[row][col];

  if (selected) {
    const move = {
      fromRow: selected.row,
      fromCol: selected.col,
      toRow: row,
      toCol: col
    };

    if (isLegalMove(move, "white")) {
      makeMove(move);
      selected = null;
      turn = "black";
      checkGameState();

      if (!gameOver) {
        setTimeout(cpuMove, 500);
      }
    } else {
      selected = null;
    }

    renderBoard();
    return;
  }

  if (piece && isOwnPiece(piece, "white")) {
    selected = { row, col };
    renderBoard();
  }
}

function cpuMove() {
  if (gameOver || turn !== "black") return;

  const moves = getAllLegalMoves("black");

  if (moves.length === 0) {
    checkGameState();
    return;
  }

  const randomMove = moves[Math.floor(Math.random() * moves.length)];
  makeMove(randomMove);

  turn = "white";
  checkGameState();
  renderBoard();
}

function makeMove(move) {
  const piece = board[move.fromRow][move.fromCol];

  board[move.toRow][move.toCol] = piece;
  board[move.fromRow][move.fromCol] = "";

  // ポーン昇格
  if (piece === "P" && move.toRow === 0) {
    board[move.toRow][move.toCol] = "Q";
  }

  if (piece === "p" && move.toRow === 7) {
    board[move.toRow][move.toCol] = "q";
  }
}

function isLegalMove(move, color) {
  const piece = board[move.fromRow][move.fromCol];

  if (!piece) return false;
  if (!isOwnPiece(piece, color)) return false;

  const target = board[move.toRow][move.toCol];

  if (target && isOwnPiece(target, color)) return false;

  if (!isBasicValidMove(piece, move.fromRow, move.fromCol, move.toRow, move.toCol)) {
    return false;
  }

  const backupFrom = board[move.fromRow][move.fromCol];
  const backupTo = board[move.toRow][move.toCol];

  board[move.toRow][move.toCol] = backupFrom;
  board[move.fromRow][move.fromCol] = "";

  const stillInCheck = isKingInCheck(color);

  board[move.fromRow][move.fromCol] = backupFrom;
  board[move.toRow][move.toCol] = backupTo;

  return !stillInCheck;
}

function isBasicValidMove(piece, fromRow, fromCol, toRow, toCol) {
  const rowDiff = toRow - fromRow;
  const colDiff = toCol - fromCol;

  switch (piece.toLowerCase()) {
    case "p":
      return isValidPawnMove(piece, fromRow, fromCol, toRow, toCol);

    case "r":
      return isStraightMove(fromRow, fromCol, toRow, toCol);

    case "n":
      return (
        Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1 ||
        Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2
      );

    case "b":
      return isDiagonalMove(fromRow, fromCol, toRow, toCol);

    case "q":
      return (
        isStraightMove(fromRow, fromCol, toRow, toCol) ||
        isDiagonalMove(fromRow, fromCol, toRow, toCol)
      );

    case "k":
      return Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1;

    default:
      return false;
  }
}

function isValidPawnMove(piece, fromRow, fromCol, toRow, toCol) {
  const direction = piece === "P" ? -1 : 1;
  const startRow = piece === "P" ? 6 : 1;
  const target = board[toRow][toCol];

  if (fromCol === toCol && !target) {
    if (toRow === fromRow + direction) return true;

    if (
      fromRow === startRow &&
      toRow === fromRow + direction * 2 &&
      !board[fromRow + direction][fromCol]
    ) {
      return true;
    }
  }

  if (
    Math.abs(toCol - fromCol) === 1 &&
    toRow === fromRow + direction &&
    target &&
    isEnemyPiece(target, piece === piece.toUpperCase() ? "white" : "black")
  ) {
    return true;
  }

  return false;
}

function isStraightMove(fromRow, fromCol, toRow, toCol) {
  if (fromRow !== toRow && fromCol !== toCol) return false;
  return isPathClear(fromRow, fromCol, toRow, toCol);
}

function isDiagonalMove(fromRow, fromCol, toRow, toCol) {
  if (Math.abs(toRow - fromRow) !== Math.abs(toCol - fromCol)) return false;
  return isPathClear(fromRow, fromCol, toRow, toCol);
}

function isPathClear(fromRow, fromCol, toRow, toCol) {
  const rowStep = Math.sign(toRow - fromRow);
  const colStep = Math.sign(toCol - fromCol);

  let row = fromRow + rowStep;
  let col = fromCol + colStep;

  while (row !== toRow || col !== toCol) {
    if (board[row][col]) return false;
    row += rowStep;
    col += colStep;
  }

  return true;
}

function isOwnPiece(piece, color) {
  if (!piece) return false;

  return color === "white"
    ? piece === piece.toUpperCase()
    : piece === piece.toLowerCase();
}

function isEnemyPiece(piece, color) {
  if (!piece) return false;

  return color === "white"
    ? piece === piece.toLowerCase()
    : piece === piece.toUpperCase();
}

function findKing(color) {
  const king = color === "white" ? "K" : "k";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      if (board[row][col] === king) {
        return { row, col };
      }
    }
  }

  return null;
}

function isKingInCheck(color) {
  const king = findKing(color);
  if (!king) return true;

  const enemyColor = color === "white" ? "black" : "white";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const piece = board[row][col];

      if (piece && isOwnPiece(piece, enemyColor)) {
        if (isBasicValidMove(piece, row, col, king.row, king.col)) {
          return true;
        }
      }
    }
  }

  return false;
}

function getAllLegalMoves(color) {
  const moves = [];

  for (let fromRow = 0; fromRow < 8; fromRow++) {
    for (let fromCol = 0; fromCol < 8; fromCol++) {
      const piece = board[fromRow][fromCol];

      if (!piece || !isOwnPiece(piece, color)) continue;

      for (let toRow = 0; toRow < 8; toRow++) {
        for (let toCol = 0; toCol < 8; toCol++) {
          const move = { fromRow, fromCol, toRow, toCol };

          if (isLegalMove(move, color)) {
            moves.push(move);
          }
        }
      }
    }
  }

  return moves;
}

function checkGameState() {
  const moves = getAllLegalMoves(turn);
  const inCheck = isKingInCheck(turn);

  if (moves.length === 0 && inCheck) {
    gameOver = true;

    if (turn === "white") {
      statusElement.textContent = "チェックメイト！黒の勝ちです";
    } else {
      statusElement.textContent = "チェックメイト！白の勝ちです";
    }

    return;
  }

  if (moves.length === 0 && !inCheck) {
    gameOver = true;
    statusElement.textContent = "ステイルメイト！引き分けです";
    return;
  }

  updateStatus();
}

function updateStatus() {
  if (gameOver) return;

  const checkText = isKingInCheck(turn) ? " チェック！" : "";

  statusElement.textContent =
    turn === "white"
      ? "白の番です" + checkText
      : "黒CPUの番です" + checkText;
}

function resetGame() {
  initBoard();
}

initBoard();
</script>

</body>
</html>
